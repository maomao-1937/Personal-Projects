services:
  - type: web
    name: ai-mirror-realm-backend
    env: python
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app.main:app -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --workers 2
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        value: sqlite:///./mirror_realm.db
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://ai-mirror-realm.vercel.app
      - key: AI_API_KEY
        sync: false
      - key: AI_API_BASE_URL
        value: https://tokenhub.tencentmaas.com
      - key: AI_MODEL
        value: hy-image-v3
