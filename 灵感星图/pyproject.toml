[project]
name = "inspiration-constellation"
version = "0.1.0"
description = "灵感星图：把旧素材推进成可验证的项目假设。"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.60,<1",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "openai>=1.100,<3",
  "pydantic-settings>=2.5,<3",
  "psycopg[binary]>=3.2,<4",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = [
  "pytest>=8,<10",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["."]
