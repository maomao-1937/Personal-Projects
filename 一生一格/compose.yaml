services:
  app:
    build: .
    env_file: .env.production
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8787
      DB_PATH: /app/data/life.sqlite
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - life_data:/app/data
    restart: unless-stopped

volumes:
  life_data:
