<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ShipCheck — 开发前理 PRD · 上线后验交付</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ===== Auros Design Tokens — Abyssal Terminal with Bioluminescent Data Orbs ===== */
:root {
  /* Colors — Liquid teal stack + rationed accents */
  --color-liquid-abyss: #012624;
  --color-liquid-deep: #011d1c;
  --color-liquid-kelp: #003734;
  --color-liquid-mist: #edfffe;
  --color-platinum: #ffffff;
  --color-silver-mist: #bbc7c6;
  --color-slate-deep: #707777;
  --color-lavender-phosphor: #fde9ff;
  --color-aurora-gradient: linear-gradient(90deg, rgb(203, 255, 252) 0%, rgb(237, 255, 254) 26.25%, rgb(255, 253, 250) 47.57%, rgb(250, 209, 255) 88.96%);
  --color-bioluminescent: #00827c;

  /* Typography */
  --font-matter: 'Inter', ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;

  /* Type Scale — Auros */
  --text-caption: 10px;
  --tracking-caption: 1.5px;
  --text-body: 16px;
  --leading-body: 1.4;
  --text-subheading: 24px;
  --leading-subheading: 1.3;
  --text-heading: 36px;
  --leading-heading: 1;
  --text-heading-lg: 61px;
  --leading-heading-lg: 1;

  --fw-regular: 400;
  --fw-medium: 500;

  /* Spacing */
  --spacing-12: 12px;
  --spacing-16: 16px;
  --spacing-20: 20px;
  --spacing-24: 24px;
  --spacing-32: 32px;
  --spacing-36: 36px;
  --spacing-48: 48px;
  --spacing-64: 64px;
  --spacing-80: 80px;
  --spacing-120: 120px;

  /* Shape vocabulary — ONLY 16px (cards) & 6px (buttons/small) */
  --radius-cards: 16px;
  --radius-small: 6px;

  /* Layout */
  --page-max-width: 1440px;
  --card-padding: 36px;
  --element-gap: 20px;
}

* { box-sizing: border-box; }

html { scroll-behavior: smooth; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--color-liquid-abyss);
  color: var(--color-silver-mist);
  font-family: var(--font-matter);
  font-weight: var(--fw-regular);
  font-size: var(--text-body);
  line-height: var(--leading-body);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* ===== Atmospheric bioluminescent glow — top of canvas ===== */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background:
    radial-gradient(ellipse 70% 40% at 50% -8%, rgba(0, 130, 124, 0.22) 0%, rgba(0, 130, 124, 0.06) 45%, transparent 70%),
    radial-gradient(ellipse 40% 30% at 88% 12%, rgba(250, 209, 255, 0.05) 0%, transparent 65%);
}

.page {
  position: relative;
  z-index: 1;
  max-width: var(--page-max-width);
  margin: 0 auto;
}

/* ============================================================
   SHEET 1 — pinned first page (Hero + mode toggle)
   Sticky stacking: pinned via position:sticky while sheet 2 slides over
   ============================================================ */
.sheet-one {
  position: sticky;
  top: 0;
  z-index: 1;
  min-height: 100vh;
  min-height: 100svh;
  display: flex;
  flex-direction: column;
  padding: 0 var(--spacing-48);
}

/* Navigation Bar — transparent, 80px, instrument labeling */
.nav {
  height: 80px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 var(--spacing-24);
  flex-shrink: 0;
}
.nav-brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 13px;
  font-weight: var(--fw-medium);
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--color-platinum);
}
.nav-brand-mark {
  width: 10px;
  height: 10px;
  border-radius: 2px;
  background: var(--color-aurora-gradient);
  flex-shrink: 0;
}
.nav-meta {
  display: flex;
  align-items: center;
  gap: var(--spacing-24);
  font-size: 10px;
  font-weight: var(--fw-medium);
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--color-slate-deep);
}
.nav-meta .live { color: var(--color-silver-mist); }

/* Hero — centered stack over the particle orb */
.hero {
  position: relative;
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: var(--spacing-24) 0 var(--spacing-48);
  min-height: 0;
}
.hero-orb {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  opacity: 0.85;
  pointer-events: none;
}
.hero-inner {
  position: relative;
  z-index: 2;
  display: flex;
  flex-direction: column;
  align-items: center;
}
.eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  font-size: 12px;
  font-weight: var(--fw-medium);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--color-silver-mist);
  margin-bottom: var(--spacing-24);
}
.eyebrow::before, .eyebrow::after {
  content: "";
  width: 24px;
  height: 1px;
  background: rgba(187, 199, 198, 0.3);
}
.hero-title {
  font-size: clamp(52px, 8vw, 92px);
  font-weight: var(--fw-medium);
  line-height: 1.05;
  letter-spacing: 0.01em;
  color: var(--color-platinum);
  margin: 0 0 var(--spacing-24);
}
.hero-sub {
  max-width: 560px;
  font-size: 18px;
  letter-spacing: 0.08em;
  line-height: var(--leading-body);
  color: var(--color-silver-mist);
  margin: 0;
}

/* Segmented mode toggle — pinned at bottom of sheet 1 */
.seg-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--spacing-24);
  padding-bottom: var(--spacing-48);
  flex-shrink: 0;
}
.seg {
  display: inline-flex;
  gap: 4px;
  padding: 4px;
  background: var(--color-liquid-deep);
  border-radius: var(--radius-small);
  border: 1px solid rgba(255, 255, 255, 0.06);
}
.seg button {
  border: 0;
  background: transparent;
  padding: 10px 28px;
  cursor: pointer;
  font-family: var(--font-matter);
  font-size: 12px;
  font-weight: var(--fw-medium);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--color-slate-deep);
  border-radius: var(--radius-small);
  transition: color 0.18s ease, background 0.18s ease;
}
.seg button:hover { color: var(--color-silver-mist); }
.seg button.on {
  background: var(--color-liquid-kelp);
  color: var(--color-platinum);
}

/* Scroll hint — breathing arrow */
.scroll-hint {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  font-size: var(--text-caption);
  font-weight: var(--fw-medium);
  letter-spacing: var(--tracking-caption);
  text-transform: uppercase;
  color: var(--color-slate-deep);
  cursor: pointer;
  background: none;
  border: none;
  font-family: var(--font-matter);
  padding: 0;
}
.scroll-hint .arrow {
  width: 1px;
  height: 28px;
  background: linear-gradient(to bottom, rgba(187, 199, 198, 0.4), transparent);
  position: relative;
}
.scroll-hint .arrow::after {
  content: "";
  position: absolute;
  left: -3.5px;
  bottom: 0;
  width: 8px;
  height: 8px;
  border-right: 1px solid var(--color-silver-mist);
  border-bottom: 1px solid var(--color-silver-mist);
  transform: rotate(45deg);
  animation: hint-float 1.8s ease-in-out infinite;
}
@keyframes hint-float {
  0%, 100% { transform: rotate(45deg) translate(0, 0); opacity: 0.5; }
  50% { transform: rotate(45deg) translate(3px, 3px); opacity: 1; }
}

/* ============================================================
   SHEET 2 — slides up over sheet 1 like a rising card
   Opaque bg + rounded top + scroll-driven scale entrance
   ============================================================ */
.sheet-two {
  position: relative;
  z-index: 2;
  background: var(--color-liquid-abyss);
  border-radius: 28px 28px 0 0;
  padding: 0 var(--spacing-48) var(--spacing-120);
  box-shadow: 0 -24px 80px rgba(0, 0, 0, 0.45);
  transform-origin: center top;
}
/* Sheet 2 carries its own glow so it fully covers sheet 1 */
.sheet-two::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  pointer-events: none;
  background:
    radial-gradient(ellipse 60% 30% at 50% 0%, rgba(0, 130, 124, 0.16) 0%, transparent 60%);
}

/* Compact in-page nav — sticks to top while browsing sheet 2 */
.sub-nav {
  position: sticky;
  top: 0;
  z-index: 50;
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 64px;
  margin: 0 calc(var(--spacing-48) * -1);
  padding: 0 var(--spacing-48);
  background: linear-gradient(to bottom, rgba(1, 38, 36, 0.92), rgba(1, 38, 36, 0.75) 70%, transparent);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}
.sub-nav-brand {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 11px;
  font-weight: var(--fw-medium);
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--color-silver-mist);
}
.sub-nav-brand .nav-brand-mark { width: 8px; height: 8px; }
.btn-top {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: transparent;
  color: var(--color-silver-mist);
  padding: 8px 14px;
  border-radius: var(--radius-small);
  cursor: pointer;
  font-family: var(--font-matter);
  font-size: 10px;
  font-weight: var(--fw-medium);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  border: 1px solid rgba(255, 255, 255, 0.14);
  transition: all 0.15s ease;
}
.btn-top:hover { color: var(--color-platinum); border-color: rgba(255, 255, 255, 0.3); }
.btn-top .up {
  width: 8px;
  height: 8px;
  border-left: 1px solid currentColor;
  border-top: 1px solid currentColor;
  transform: rotate(45deg) translate(1px, 1px);
}

/* ===== Surface Card — Liquid Kelp, 16px, NO shadow, NO border ===== */
.card {
  position: relative;
  background: var(--color-liquid-kelp);
  border-radius: var(--radius-cards);
  padding: var(--card-padding);
  max-width: 780px;
  margin: var(--spacing-32) auto var(--spacing-24);
}
.card-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: var(--spacing-16);
  flex-wrap: wrap;
  margin-bottom: var(--spacing-32);
}
.card-title {
  font-size: var(--text-subheading);
  font-weight: var(--fw-medium);
  line-height: var(--leading-subheading);
  letter-spacing: -0.01em;
  color: var(--color-platinum);
  margin: 0;
}
.card-sub {
  font-size: 13px;
  color: var(--color-silver-mist);
  margin-top: 6px;
  line-height: 1.5;
}

/* ===== Uppercase tracked labels — instrument labeling ===== */
label.sc-label {
  display: block;
  font-size: var(--text-caption);
  font-weight: var(--fw-medium);
  letter-spacing: var(--tracking-caption);
  text-transform: uppercase;
  color: var(--color-liquid-mist);
  margin: 0 0 var(--spacing-12);
}
label.sc-label .req { color: var(--color-slate-deep); }
.hint {
  font-size: 12px;
  color: var(--color-slate-deep);
  margin: 0;
  line-height: 1.5;
}

/* ===== Text Input — recessed deep field ===== */
textarea, input[type=text], input[type=url] {
  width: 100%;
  font-family: var(--font-matter);
  font-weight: var(--fw-regular);
  font-size: 14px;
  line-height: 1.6;
  padding: 14px 16px;
  background: var(--color-liquid-deep);
  border: 1px solid rgba(255, 255, 255, 0.10);
  border-radius: var(--radius-small);
  color: var(--color-liquid-mist);
  transition: border-color 0.15s ease;
  outline: none;
}
textarea { min-height: 180px; resize: vertical; }
textarea::placeholder, input::placeholder { color: rgba(112, 119, 119, 0.85); }
textarea:focus, input[type=text]:focus, input[type=url]:focus {
  border-color: var(--color-bioluminescent);
}

.checkbox-row {
  display: flex;
  align-items: center;
  gap: var(--spacing-12);
  margin-top: var(--spacing-20);
}
.checkbox-row input[type=checkbox] {
  appearance: none;
  width: 16px;
  height: 16px;
  border-radius: 4px;
  cursor: pointer;
  position: relative;
  flex-shrink: 0;
  background: var(--color-liquid-deep);
  border: 1px solid rgba(255, 255, 255, 0.18);
  transition: background 0.15s ease;
}
.checkbox-row input[type=checkbox]:checked {
  background: var(--color-bioluminescent);
  border-color: var(--color-bioluminescent);
}
.checkbox-row input[type=checkbox]:checked::after {
  content: "";
  position: absolute;
  left: 4.5px; top: 1.5px;
  width: 4px; height: 8px;
  border: solid var(--color-platinum);
  border-width: 0 1.5px 1.5px 0;
  transform: rotate(45deg);
}
.checkbox-row label {
  margin: 0;
  font-size: 13px;
  color: var(--color-silver-mist);
  cursor: pointer;
  line-height: 1.5;
}

/* ===== Buttons ===== */
.btn-tools {
  display: flex;
  gap: 8px;
  margin: var(--spacing-12) 0 var(--spacing-20);
  justify-content: flex-end;
}
.btn-ghost {
  background: transparent;
  color: var(--color-silver-mist);
  padding: 8px 14px;
  border-radius: var(--radius-small);
  cursor: pointer;
  font-family: var(--font-matter);
  font-size: 10px;
  font-weight: var(--fw-medium);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  transition: all 0.15s ease;
  border: 1px solid rgba(255, 255, 255, 0.14);
}
.btn-ghost:hover {
  color: var(--color-platinum);
  border-color: rgba(255, 255, 255, 0.3);
}

/* Gradient Pill Button — aurora, the ONLY chromatic CTA */
.btn-primary {
  background: var(--color-aurora-gradient);
  color: #222222;
  border: none;
  padding: 14px 28px;
  border-radius: var(--radius-small);
  cursor: pointer;
  font-family: var(--font-matter);
  font-size: 13px;
  font-weight: var(--fw-medium);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  transition: filter 0.18s ease, transform 0.18s ease;
}
.btn-primary:hover { filter: brightness(1.06); transform: translateY(-1px); }
.btn-primary:disabled {
  opacity: 0.4;
  cursor: not-allowed;
  transform: none;
  filter: none;
}
.btn-group {
  display: flex;
  gap: var(--spacing-20);
  align-items: center;
  margin-top: var(--spacing-24);
  flex-wrap: wrap;
}

/* ===== Status ===== */
.status {
  font-size: 12px;
  font-weight: var(--fw-medium);
  letter-spacing: 0.06em;
}
.status.pending, .status.running { color: var(--color-liquid-mist); }
.status.done { color: var(--color-lavender-phosphor); }
.status.failed { color: var(--color-platinum); }

/* ===== Statistic Counter — lavender phosphor numbers ===== */
.stats {
  display: flex;
  gap: var(--spacing-48);
  flex-wrap: wrap;
  margin: 0 0 var(--spacing-32);
  padding-bottom: var(--spacing-32);
  border-bottom: 1px solid rgba(255, 255, 255, 0.08);
}
.stat b {
  display: block;
  font-size: var(--text-heading);
  font-weight: var(--fw-medium);
  line-height: 1;
  letter-spacing: -0.02em;
  color: var(--color-lavender-phosphor);
}
.stat span {
  display: block;
  margin-top: 8px;
  font-size: var(--text-caption);
  font-weight: var(--fw-regular);
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--color-silver-mist);
}
/* 语义底纹:红=高/失败,黄=中,绿=低/通过 */
.stat.sev-high   { background: rgba(255, 99, 99, 0.10); }
.stat.sev-high b   { color: #ff9b9b; }
.stat.sev-medium { background: rgba(255, 193, 69, 0.10); }
.stat.sev-medium b { color: #ffca6b; }
.stat.sev-low    { background: rgba(74, 222, 128, 0.10); }
.stat.sev-low b    { color: #7ee2a8; }
.stat.sev-pass   { background: rgba(74, 222, 128, 0.10); }
.stat.sev-pass b   { color: #7ee2a8; }
.stat.sev-fail   { background: rgba(255, 99, 99, 0.10); }
.stat.sev-fail b   { color: #ff9b9b; }

/* ===== Doc attachment chip ===== */
.doc-chip-wrap {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 10px;
}
.doc-chip {
  display: inline-flex;
  align-items: center;
  gap: 12px;
  max-width: 100%;
  padding: 9px 12px;
  background: var(--color-liquid-deep);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: var(--radius-small);
}
.doc-chip svg { flex: none; width: 18px; height: 18px; }
.doc-chip .meta { min-width: 0; display: flex; flex-direction: column; }
.doc-chip .name {
  font-size: 13px;
  font-weight: var(--fw-medium);
  color: var(--color-liquid-mist);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.doc-chip .size {
  font-size: 11px;
  color: var(--color-slate-deep);
  letter-spacing: 0.06em;
}
.doc-chip .rm {
  flex: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 24px;
  height: 24px;
  background: none;
  border: none;
  border-radius: var(--radius-small);
  color: var(--color-silver-mist);
  font-size: 15px;
  cursor: pointer;
  transition: color 0.15s ease, background 0.15s ease;
}
.doc-chip .rm:hover { color: #ff9b9b; background: rgba(255, 99, 99, 0.10); }

/* ===== Status pills ===== */
.pill {
  display: inline-flex;
  align-items: center;
  padding: 4px 10px;
  border-radius: var(--radius-small);
  font-size: 10px;
  font-weight: var(--fw-medium);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  line-height: 1.4;
}
/* 语义色:绿=通过/低危,黄=中危,红=失败/高危 */
.pill.passed  { background: rgba(74, 222, 128, 0.15); color: #7ee2a8; }
.pill.failed  { background: rgba(255, 99, 99, 0.17); color: #ff9b9b; }
.pill.skipped { background: rgba(255, 255, 255, 0.06); color: var(--color-silver-mist); }
.pill.high    { background: rgba(255, 99, 99, 0.17); color: #ff9b9b; }
.pill.medium  { background: rgba(255, 193, 69, 0.16); color: #ffca6b; }
.pill.low     { background: rgba(74, 222, 128, 0.15); color: #7ee2a8; }

/* ===== Table ===== */
.table-wrap {
  overflow-x: auto;
  border-radius: var(--radius-small);
  margin: var(--spacing-16) 0 var(--spacing-24);
  border: 1px solid rgba(255, 255, 255, 0.08);
}
table {
  width: 100%;
  border-collapse: collapse;
  min-width: 680px;
}
th, td {
  text-align: left;
  padding: 14px 16px;
  vertical-align: top;
  font-size: 13px;
  color: var(--color-silver-mist);
  font-weight: var(--fw-regular);
  line-height: 1.5;
}
thead th {
  font-size: var(--text-caption);
  font-weight: var(--fw-medium);
  letter-spacing: var(--tracking-caption);
  text-transform: uppercase;
  color: var(--color-slate-deep);
  background: var(--color-liquid-deep);
  border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  white-space: nowrap;
}
tbody tr + tr td { border-top: 1px solid rgba(255, 255, 255, 0.06); }
tbody tr:hover td { background: rgba(1, 29, 28, 0.5); }
td.desc { color: var(--color-liquid-mist); font-weight: var(--fw-regular); }
td.seq { color: var(--color-slate-deep); }

/* ===== Evidence ===== */
.ev-img {
  max-width: 320px;
  border-radius: var(--radius-small);
  display: block;
  margin-top: 10px;
  border: 1px solid rgba(255, 255, 255, 0.10);
}
details {
  margin-top: 10px;
  background: var(--color-liquid-deep);
  border-radius: var(--radius-small);
  padding: 10px 14px;
}
details summary {
  font-size: var(--text-caption);
  font-weight: var(--fw-medium);
  letter-spacing: var(--tracking-caption);
  text-transform: uppercase;
  color: var(--color-silver-mist);
  cursor: pointer;
  list-style: none;
}
details summary::-webkit-details-marker { display: none; }
details[open] { padding-bottom: 12px; }
pre {
  background: var(--color-liquid-deep);
  padding: 14px 16px;
  border-radius: var(--radius-small);
  border: 1px solid rgba(255, 255, 255, 0.06);
  white-space: pre-wrap;
  word-break: break-word;
  margin: 10px 0 0;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 12px;
  line-height: 1.65;
  color: var(--color-liquid-mist);
}
code {
  background: var(--color-liquid-deep);
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 12px;
  color: #cbfffc;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
a {
  color: #cbfffc;
  text-decoration: none;
  border-bottom: 1px solid rgba(203, 255, 252, 0.3);
}
a:hover { border-bottom-color: #cbfffc; }

.error { color: #fde9ff; font-weight: var(--fw-medium); }

<script>
/* ===== Bioluminescent particle orb ===== */
(function () {
  const cv = document.getElementById("orb");
  const ctx = cv.getContext("2d");
  let W = 0, H = 0, DPR = 1;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    const r = cv.parentElement.getBoundingClientRect();
    W = r.width; H = r.height;
    cv.width = W * DPR; cv.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener("resize", resize);
  resize();

  const N = 480;
  const pts = [];
  for (let i = 0; i < N; i++) {
    const y = 1 - (i / (N - 1)) * 2;
    const r = Math.sqrt(1 - y * y);
    const th = i * 2.39996323;
    pts.push({ x: Math.cos(th) * r, y, z: Math.sin(th) * r });
  }
  const AQUA = "203,255,252", WHITE = "237,255,254", PINK = "250,209,255";
  pts.forEach((p, i) => {
    p.c = (i % 23 === 0) ? PINK : (i % 3 === 0 ? WHITE : AQUA);
    p.s = 0.8 + ((i * 7919) % 100) / 100 * 1.1;
  });

  let rot = 0;
  const TILT = -0.35;

  function frame() {
    rot += 0.0022;
    ctx.clearRect(0, 0, W, H);
    const cx = W / 2, cy = H / 2;
    const R = Math.min(W, H) * 0.36;
    const ct = Math.cos(TILT), st = Math.sin(TILT);

    const proj = [];
    for (const p of pts) {
      const x1 = p.x * Math.cos(rot) - p.z * Math.sin(rot);
      const z1 = p.x * Math.sin(rot) + p.z * Math.cos(rot);
      const y2 = p.y * ct - z1 * st;
      const z2 = p.y * st + z1 * ct;
      const persp = 1 / (2.6 - z2);
      proj.push({
        sx: cx + x1 * R * persp * 2.6,
        sy: cy + y2 * R * persp * 2.6,
        depth: (z2 + 1) / 2,
        c: p.c, s: p.s
      });
    }
    proj.sort((a, b) => a.depth - b.depth);
    for (const q of proj) {
      const a = 0.06 + q.depth * q.depth * 0.5;
      const size = q.s * (0.7 + q.depth * 1.2);
      ctx.beginPath();
      ctx.arc(q.sx, q.sy, size, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(" + q.c + "," + a.toFixed(3) + ")";
      ctx.fill();
    }
    requestAnimationFrame(frame);
  }
  frame();
})();

/* ===== Card-stacking entrance — sheet 2 scales up as it covers sheet 1 ===== */
(function () {
  const sheet = document.getElementById("sheet-two");
  if (!sheet) return;
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (reduce) return;

  let ticking = false;
  function update() {
    ticking = false;
    const rect = sheet.getBoundingClientRect();
    const vh = window.innerHeight;
    // progress 0 → sheet top at viewport bottom; 1 → sheet top reaches viewport top
    const p = Math.min(1, Math.max(0, 1 - rect.top / vh));
    if (p >= 1) {
      // 翻页完成：清除 transform，恢复内部 sticky（transform 会破坏子级 sticky 定位）
      sheet.style.transform = "";
      sheet.style.borderRadius = "";
      sheet.style.willChange = "auto";
      return;
    }
    const scale = 0.94 + 0.06 * p;
    const radius = Math.round(28 - 16 * p);
    sheet.style.willChange = "transform";
    sheet.style.transform = "scale(" + scale.toFixed(4) + ")";
    sheet.style.borderRadius = radius + "px " + radius + "px 0 0";
  }
  function onScroll() {
    if (!ticking) {
      ticking = true;
      requestAnimationFrame(update);
    }
  }
  window.addEventListener("scroll", onScroll, { passive: true });
  window.addEventListener("resize", onScroll, { passive: true });
  update();
})();

/* ===== Sheet navigation — wheel flips the whole page ===== */
const sheetTwoEl = document.getElementById("sheet-two");
let pageLock = false;
const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

function goToSheet2() {
  if (pageLock) return;
  pageLock = true;
  window.scrollTo({ top: sheetTwoEl.offsetTop, behavior: reduceMotion ? "auto" : "smooth" });
  setTimeout(() => { pageLock = false; }, 900);
}
function goToSheet1() {
  if (pageLock) return;
  pageLock = true;
  window.scrollTo({ top: 0, behavior: reduceMotion ? "auto" : "smooth" });
  setTimeout(() => { pageLock = false; }, 900);
}

/* 滚轮一次动作 = 翻一整页：第一页向下滚→翻到第二页；第二页顶端向上滚→翻回第一页 */
window.addEventListener("wheel", (e) => {
  const y = window.scrollY;
  const top2 = sheetTwoEl.offsetTop;
  // 第一页占据视口：向下滚 → 整页翻到第二页
  if (y < top2 - 4) {
    if (e.deltaY > 0) {
      e.preventDefault();
      goToSheet2();
    }
    return;
  }
  // 停在第二页顶端：向上滚 → 整页翻回第一页（第二页内部正常滚动不受影响）
  if (y <= top2 + 8 && e.deltaY < 0) {
    e.preventDefault();
    goToSheet1();
  }
}, { passive: false });

/* ===== App logic ===== */
const API = "/api/v1";
let pollTimer = null;
let lastContext = null;

/* ===== 邀请码门禁 ===== */
let inviteCode = localStorage.getItem("sc_invite") || "";

function authHeaders() {
  return inviteCode ? {"X-Invite-Code": inviteCode} : {};
}

function apiFetch(path, options) {
  options = options || {};
  options.headers = Object.assign({}, options.headers || {}, authHeaders());
  return fetch(API + path, options);
}

async function redeemInvite() {
  const input = document.getElementById("gate-input");
  const err = document.getElementById("gate-error");
  const btn = document.getElementById("gate-btn");
  const code = (input.value || "").trim().toUpperCase();
  if (!code) { err.textContent = "请输入邀请码"; return; }
  btn.disabled = true;
  err.textContent = "";
  try {
    const resp = await fetch(API + "/invite/redeem", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({code}),
    });
    const data = await resp.json();
    if (!resp.ok) {
      err.textContent = data.error?.message || "邀请码校验失败";
      btn.disabled = false;
      return;
    }
    inviteCode = code;
    localStorage.setItem("sc_invite", code);
    document.getElementById("gate").style.display = "none";
    if (data.remaining !== undefined && data.remaining <= 2) {
      // 额度将尽,温和提示一次
      console.log("邀请码剩余次数:", data.remaining);
    }
  } catch (e) {
    err.textContent = "网络错误,请重试";
    btn.disabled = false;
  }
}

function showGateWith(msg) {
  /* 清掉失效码并重新弹门;若 URL 带新码则预填 */
  localStorage.removeItem("sc_invite");
  inviteCode = "";
  document.getElementById("gate").style.display = "";
  document.getElementById("gate-error").textContent = msg || "";
  const input = document.getElementById("gate-input");
  const pre = new URLSearchParams(location.search).get("invite");
  input.value = pre ? pre.toUpperCase() : "";
  setTimeout(() => input.focus(), 100);
}

function maybeInviteError(data) {
  /* 业务接口返回邀请码类错误 → 弹门重新输入 */
  const c = (data && data.error && data.error.code) || "";
  if (c.indexOf("invite_") === 0) {
    showGateWith(data.error.message);
    return true;
  }
  return false;
}

(function initGate() {
  const gate = document.getElementById("gate");
  const input = document.getElementById("gate-input");
  input.addEventListener("keydown", e => { if (e.key === "Enter") redeemInvite(); });
  if (inviteCode) {
    // 已有码:静默校验有效性(不消耗额度);码被删/停用/用完 → 重新弹门
    fetch(API + "/invite/status?code=" + encodeURIComponent(inviteCode))
      .then(async r => {
        if (r.status === 404) return null;  // 码不存在(如旧的10码已被清理)
        if (!r.ok) throw 0;                 // 网络/服务异常,放行,后端仍会强制校验
        return r.json();
      })
      .then(st => {
        if (st && st.active && st.remaining > 0) return;
        showGateWith("原邀请码已失效,请输入新邀请码");
      })
      .catch(() => {});
  } else {
    // 支持 ?invite=CODE 预填
    const pre = new URLSearchParams(location.search).get("invite");
    if (pre) input.value = pre.toUpperCase();
    gate.style.display = "";
    setTimeout(() => input.focus(), 100);
  }
})();

function selectAll(id) {
  const el = document.getElementById(id);
  el.focus();
  if (el.select) el.select();
  if (window.getSelection && document.createRange) {
    const range = document.createRange();
    range.selectNodeContents(el);
    const sel = window.getSelection();
    sel.removeAllRanges(); sel.addRange(range);
  }
}
function clearText(id) {
  const el = document.getElementById(id);
  el.value = "";
  el.focus();
}

/* ===== 文档上传:以附件形式附加,MD/TXT 直接读文本,PDF 用 pdf.js 提取 ===== */
const docFiles = {acc: null, rev: null};  // {name, size, text}
let docTargetKey = null;

function uploadDoc(key) {
  docTargetKey = key;
  const fi = document.getElementById("doc-file");
  fi.value = "";
  fi.click();
}

function fmtSize(n) {
  if (n >= 1024 * 1024) return (n / 1024 / 1024).toFixed(1) + " MB";
  if (n >= 1024) return (n / 1024).toFixed(0) + " KB";
  return n + " B";
}

function renderDocChip(key) {
  const wrap = document.getElementById(key + "-doc-chip");
  const f = docFiles[key];
  if (!f) { wrap.innerHTML = ""; return; }
  wrap.innerHTML = `
    <div class="doc-chip">
      <svg viewBox="0 0 24 24" fill="none" stroke="#7ee2a8" stroke-width="1.6">
        <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/>
        <path d="M14 3v5h5"/>
      </svg>
      <div class="meta">
        <span class="name">${esc(f.name)}</span>
        <span class="size">${fmtSize(f.size)} · ${f.text.length} 字符</span>
      </div>
      <button class="rm" onclick="removeDoc('${key}')" title="移除附件">×</button>
    </div>`;
}

function removeDoc(key) {
  docFiles[key] = null;
  renderDocChip(key);
}

/* 组合提交用的 PRD:文本框内容 + 附件内容 */
function getPrdText(key) {
  const ta = document.getElementById(key + "-prd");
  const parts = [ (ta.value || "").trim(), docFiles[key] ? docFiles[key].text.trim() : "" ];
  return parts.filter(Boolean).join("\n\n");
}

function loadPdfJs() {
  /* 懒加载:只在首次选 PDF 时引入 */
  if (window.pdfjsLib) return Promise.resolve();
  return new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
    s.onload = () => {
      window.pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
      resolve();
    };
    s.onerror = () => reject(new Error("pdf.js 加载失败,请检查网络"));
    document.head.appendChild(s);
  });
}

async function extractPdfText(file) {
  await loadPdfJs();
  const buf = await file.arrayBuffer();
  const pdf = await window.pdfjsLib.getDocument({data: buf}).promise;
  const pages = [];
  for (let i = 1; i <= pdf.numPages; i++) {
    const page = await pdf.getPage(i);
    const tc = await page.getTextContent();
    pages.push(tc.items.map(it => it.str).join(" "));
  }
  return pages.join("\n\n");
}

async function handleDocFile(input) {
  const file = input.files && input.files[0];
  if (!file || !docTargetKey) return;
  const key = docTargetKey;
  const name = file.name.toLowerCase();
  if (file.size > 20 * 1024 * 1024) {
    alert("文件超过 20MB,请精简后上传");
    return;
  }
  const wrap = document.getElementById(key + "-doc-chip");
  wrap.innerHTML = `<div class="doc-chip"><div class="meta"><span class="name">正在解析 ${esc(file.name)} …</span><span class="size">请稍候</span></div></div>`;
  try {
    let text;
    if (name.endsWith(".pdf")) {
      text = await extractPdfText(file);
      if (!text.trim()) {
        renderDocChip(key);
        alert("PDF 中未提取到文本(可能是扫描件/图片型 PDF),请改用文本版或直接粘贴");
        return;
      }
    } else {
      text = await file.text();
    }
    docFiles[key] = {name: file.name, size: file.size, text};
    renderDocChip(key);
  } catch (e) {
    renderDocChip(key);
    alert("解析失败:" + (e.message || e));
  }
}

function switchTab(t) {
  document.getElementById("form-acceptance").style.display = t === "acceptance" ? "" : "none";
  document.getElementById("form-review").style.display = t === "review" ? "" : "none";
  document.getElementById("tab-acceptance").classList.toggle("on", t === "acceptance");
  document.getElementById("tab-review").classList.toggle("on", t === "review");
  document.getElementById("result").innerHTML = "";
  // 选择模式后直接翻到第二页
  if (window.scrollY < sheetTwoEl.offsetTop - 4) goToSheet2();
}

async function submitJob(path, body, btnId, ctx) {
  lastContext = ctx;
  const btn = document.getElementById(btnId);
  btn.disabled = true;
  document.getElementById("result").innerHTML =
    `<div class="card"><p style="margin:0; color:var(--color-liquid-mist);">提交中<span class="spinner"></span></p></div>`;
  try {
    const resp = await apiFetch(path, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify(body),
    });
    const data = await resp.json();
    if (!resp.ok) {
      if (maybeInviteError(data)) { btn.disabled = false; return; }
      document.getElementById("result").innerHTML =
        `<div class="card"><p class="error" style="margin:0;">提交失败：${data.error?.message || resp.status}</p></div>`;
      btn.disabled = false;
      return;
    }
    pollJob(data.job_id);
  } catch (e) {
    document.getElementById("result").innerHTML =
      `<div class="card"><p class="error" style="margin:0;">网络错误：${e}</p></div>`;
    btn.disabled = false;
  } finally {
    btn.disabled = false;
  }
}

function submitAcceptance() {
  const prd = getPrdText("acc");
  const url = document.getElementById("acc-url").value.trim();
  const destructive = document.getElementById("acc-destructive").checked;
  if (prd.length < 10) { alert("PRD 太短(可粘贴文本或上传文档)"); return; }
  if (!url) { alert("请填写产品网址"); return; }
  submitJob("/acceptance", {prd_text: prd, target_url: url, allow_destructive: destructive},
    "acc-submit", {type:"acceptance", prd});
}

function submitReview() {
  const prd = getPrdText("rev");
  if (prd.length < 10) { alert("PRD 太短(可粘贴文本或上传文档)"); return; }
  submitJob("/review", {prd_text: prd}, "rev-submit", {type:"review", prd});
}

function pollJob(jobId) {
  document.getElementById("result").innerHTML =
    `<div class="card">
       <p style="margin:0; color:var(--color-silver-mist);">
         状态：<span class="status pending" id="status">排队中…</span>
         <span class="spinner" style="margin-left:4px;"></span>
       </p>
     </div>`;
  if (pollTimer) clearInterval(pollTimer);
  const tick = async () => {
    try {
      const resp = await fetch(API + "/jobs/" + jobId);
      const j = await resp.json();
      const st = document.getElementById("status");
      if (st) {
        const label = {pending:"排队中…", running:"运行中…", done:"完成 ✔", failed:"失败 ✗"}[j.status] || j.status;
        st.textContent = label;
        st.className = "status " + j.status;
        if (j.status === "running" || j.status === "pending") {
          st.classList.add("spinner");
        }
      }
      if (j.status === "done" || j.status === "failed") {
        clearInterval(pollTimer); pollTimer = null;
        renderResult(j);
      }
    } catch (e) {
      console.error(e);
    }
  };
  tick();
  pollTimer = setInterval(tick, 2000);
}

function buildSuggestionsText(j) {
  const r = j.result_json || {};
  if (j.type === "review") {
    return (r.findings || []).map((f,i)=>`${i+1}. [${f.severity}/${f.category}] ${f.message} → 建议:${f.suggestion}`).join("\n");
  }
  const failed = (r.fix_tasks || []).map((f,i)=>`${i+1}. 修复任务:${f.fix}`).join("\n");
  const other = (r.checklist || []).filter(c=>c.status!=="passed")
    .map(c=>`- ${c.status.toUpperCase()}: ${c.description} (期望:${c.expected},理由:${c.judge_reason||""})`).join("\n");
  return (failed + "\n" + other).trim();
}

async function rewritePRD() {
  if (!lastContext) return;
  const btn = document.getElementById("btn-rewrite");
  if (!btn) return;
  const suggestionsText = lastContext.suggestionsText || "";
  if (!suggestionsText) { alert("没有可落实的建议"); return; }
  btn.disabled = true;
  const outBox = document.getElementById("rewrite-out");
  /* 修改中提示:按钮文案 + 秒表 + 占位说明,结束自动恢复 */
  btn.innerHTML = 'AI 修改中<span class="spinner" style="margin-left:8px;"></span>';
  const t0 = Date.now();
  const timer = setInterval(() => {
    const s = Math.round((Date.now() - t0) / 1000);
    btn.innerHTML = `AI 修改中 · ${s}s<span class="spinner" style="margin-left:8px;"></span>`;
  }, 1000);
  outBox.value = "";
  outBox.placeholder = "AI 正在根据建议改写 PRD,通常需要 30s ~ 2min……";
  try {
    const resp = await apiFetch("/rewrite-prd", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({original_prd: lastContext.prd, suggestions_text: suggestionsText}),
    });
    const data = await resp.json();
    if (!resp.ok) {
      if (maybeInviteError(data)) return;
      outBox.value = "改写失败：" + (data.error?.message || resp.status);
      return;
    }
    outBox.value = data.rewritten_prd;
    document.getElementById("rewrite-card").style.display = "";
  } catch (e) {
    outBox.value = "网络错误：" + e;
  } finally {
    clearInterval(timer);
    btn.disabled = false;
    btn.innerHTML = "修改 PRD";
    outBox.placeholder = "";
  }
}

function copyRewritten() {
  const v = document.getElementById("rewrite-out").value;
  navigator.clipboard.writeText(v).then(()=>{
    const hint = document.getElementById("copy-hint");
    hint.textContent = "✓ 已复制";
    setTimeout(()=>hint.textContent="", 1500);
  }).catch(()=>alert("复制失败"));
}

function renderResult(j) {
  const el = document.getElementById("result");
  lastJob = j;
  if (j.status === "failed") {
    el.innerHTML = `<div class="card"><h2 class="card-title" style="margin:0 0 12px;">任务失败</h2><p class="error" style="margin:0;">${esc(j.error_message || "未知错误")}</p></div>`;
    return;
  }
  if (lastContext) { lastContext.suggestionsText = buildSuggestionsText(j); }

  const r = j.result_json || {};
  let body = "";

  if (j.type === "acceptance") {
    const s = r.summary || {};
    let rows = (r.checklist || []).map(i => `
      <tr>
        <td class="seq">#${i.seq}</td>
        <td class="desc">${esc(i.description)}</td>
        <td>${esc(i.expected)}</td>
        <td style="white-space:nowrap;"><span class="pill ${i.status}">${i.status}</span></td>
        <td>
          <div style="font-size:13px; line-height:1.6;">${esc(i.judge_reason || "—")}</div>
          ${(i.evidence || []).filter(e=>e.kind==="screenshot"&&e.url).map(e=>`
            <a href="${e.url}" target="_blank">
              <img class="ev-img" src="${e.url}" />
            </a>`).join("")}
          ${(i.evidence || []).filter(e=>e.kind!=="screenshot").map(e=>`
            <details><summary>${esc(e.kind)} 证据</summary><pre>${esc(e.content||"")}</pre></details>`).join("")}
        </td>
      </tr>`).join("");

    const total = s.total ?? 0;
    const passed = s.passed ?? 0;
    const failed = s.failed ?? 0;
    const skipped = s.skipped ?? 0;

    let fixes = (r.fix_tasks || []).map(f => `
      <li>
        <b>${esc(f.description)}</b>
        <small>${esc(f.fix)}</small>
      </li>`).join("");

    body = `
      <div class="card-header">
        <div>
          <h2 class="card-title">验收报告</h2>
          <p class="card-sub">逐条核验结果</p>
        </div>
      </div>
      <div class="stats">
        <div class="stat"><b>${total}</b><span>总项</span></div>
        <div class="stat sev-pass"><b>${passed}</b><span>通过</span></div>
        <div class="stat sev-fail"><b>${failed}</b><span>失败</span></div>
        ${skipped ? `<div class="stat"><b>${skipped}</b><span>跳过</span></div>` : ""}
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>检查项</th>
              <th>期望</th>
              <th>状态</th>
              <th>判定 & 证据</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
      ${fixes ? `
        <div class="section-title">修复任务</div>
        <ol class="fix-list">${fixes}</ol>` : ""}
    `;
  } else {
    const s = r.summary || {};
    let items = (r.findings || []).map(f => `
      <li>
        <span class="pill ${f.severity}">${f.severity}</span>
        <b>[${esc(f.category)}]</b>
        ${esc(f.message)}
        <small>${esc(f.suggestion)}</small>
      </li>`).join("");

    const total = s.total_findings ?? 0;
    const high = s.high ?? 0;
    const med = s.medium ?? 0;
    const low = s.low ?? 0;

    body = `
      <div class="card-header">
        <div>
          <h2 class="card-title">审查报告</h2>
          <p class="card-sub">逻辑问题与风险</p>
        </div>
      </div>
      <div class="stats">
        <div class="stat"><b>${total}</b><span>总问题</span></div>
        ${high ? `<div class="stat sev-high"><b>${high}</b><span>高</span></div>` : ""}
        ${med ? `<div class="stat sev-medium"><b>${med}</b><span>中</span></div>` : ""}
        ${low ? `<div class="stat sev-low"><b>${low}</b><span>低</span></div>` : ""}
      </div>
      <ul class="findings-list">${items || '<li style="color:#cbfffc;">未发现明显问题，可放心进入开发 / 验收阶段</li>'}</ul>
    `;
  }

  el.innerHTML = `
    <div class="card">
      ${body}
      <div class="rewrite-intro">
        <button class="btn-primary" id="btn-rewrite" onclick="rewritePRD()">修改 PRD</button>
        <button class="btn-ghost" onclick="downloadMarkdown()">下载 Markdown</button>
        <span class="hint">原 PRD + 建议 → 整改版</span>
      </div>
    </div>

    <div class="card" id="rewrite-card" style="display:none;">
      <div class="card-header">
        <div>
          <h2 class="card-title">整改后的 PRD</h2>
          <p class="card-sub">复制使用</p>
        </div>
        <div style="display:flex; align-items:center; gap:10px;">
          <button class="btn-ghost" onclick="copyRewritten()">复制</button>
          <span id="copy-hint" class="hint" style="min-width:64px;"></span>
        </div>
      </div>
      <textarea id="rewrite-out" class="rewritten-out" readonly></textarea>
    </div>`;
}

/* ===== Markdown 报告导出 ===== */
let lastJob = null;

function mdTable(rows) {
  return rows.map(r => "| " + r.map(c => (c || "").replace(/\|/g, "\\|").replace(/\n/g, " ")).join(" | ") + " |").join("\n");
}

function buildMarkdownReport(j) {
  const r = j.result_json || {};
  const d = new Date();
  const stamp = d.toLocaleString("zh-CN");
  const sevZh = {high: "高", medium: "中", low: "低"};
  let md = "";

  if (j.type === "acceptance") {
    const s = r.summary || {};
    md += `# ShipCheck 验收报告\n\n`
      + `- **时间**: ${stamp}\n`
      + `- **产品地址**: ${lastContext ? lastContext.url || "-" : "-"}\n`
      + `- **Job**: ${j.id}\n\n`
      + `## 总览\n\n| 总项 | 通过 | 失败 | 跳过 |\n|---:|---:|---:|---:|\n`
      + `| ${s.total ?? 0} | ${s.passed ?? 0} | ${s.failed ?? 0} | ${s.skipped ?? 0} |\n\n`;
    const rows = [["#", "检查项", "期望", "状态", "判定理由"]];
    for (const i of (r.checklist || [])) {
      rows.push([`#${i.seq}`, i.description, i.expected, i.status, i.judge_reason || "—"]);
    }
    md += `## 逐条核验\n\n` + mdTable(rows) + `\n\n`;
    const shots = (r.checklist || []).flatMap(i => (i.evidence || [])
      .filter(e => e.kind === "screenshot" && e.url)
      .map(e => ({seq: i.seq, url: e.url})));
    if (shots.length) {
      md += `## 截图证据\n\n`;
      for (const sh of shots) md += `- 检查项 #${sh.seq}: [截图](${sh.url})\n`;
      md += `\n`;
    }
    if ((r.fix_tasks || []).length) {
      md += `## 修复任务\n\n`;
      (r.fix_tasks || []).forEach((f, i) => {
        md += `${i + 1}. **${f.description}**\n   - 修复方案: ${f.fix}\n`;
      });
      md += `\n`;
    }
  } else {
    const s = r.summary || {};
    md += `# ShipCheck 审查报告\n\n`
      + `- **时间**: ${stamp}\n`
      + `- **Job**: ${j.id}\n\n`
      + `## 总览\n\n| 总问题 | 高 | 中 | 低 |\n|---:|---:|---:|---:|\n`
      + `| ${s.total_findings ?? 0} | ${s.high ?? 0} | ${s.medium ?? 0} | ${s.low ?? 0} |\n\n`;
    const fs = r.findings || [];
    if (!fs.length) {
      md += `未发现明显问题,可放心进入开发/验收阶段。\n`;
    } else {
      md += `## 问题清单\n\n`;
      fs.forEach((f, i) => {
        md += `### ${i + 1}. [${sevZh[f.severity] || f.severity}/${f.category}] ${f.message}\n\n`
          + `- **建议**: ${f.suggestion}\n\n`;
      });
    }
  }
  md += `---\n\n*本报告由 ShipCheck 生成*`;
  return md;
}

function downloadMarkdown() {
  if (!lastJob || lastJob.status !== "done") { alert("暂无可导出的报告"); return; }
  const md = buildMarkdownReport(lastJob);
  const prefix = lastJob.type === "acceptance" ? "ShipCheck-验收报告" : "ShipCheck-审查报告";
  const ts = new Date().toISOString().slice(0, 10);
  const blob = new Blob([md], {type: "text/markdown;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `${prefix}-${ts}.md`;
  document.body.appendChild(a);
  a.click();
  URL.revokeObjectURL(a.href);
  a.remove();
}

function esc(s) {
  return (s||"").replace(/[&<>"']/g,
    c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
