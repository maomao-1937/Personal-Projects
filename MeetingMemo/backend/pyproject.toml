[project]
name = "meetingmemo-backend"
version = "0.1.0"
description = "MeetingMemo closed-beta API"
requires-python = ">=3.11,<3.13"
dependencies = [
  "alembic==1.19.1",
  "fastapi==0.141.1",
  "httpx[socks]==0.28.1",
  "psycopg[binary]==3.3.4",
  "pysqlite3-binary==0.5.4.post2; sys_platform == 'linux'",
  "pydantic==2.13.4",
  "pydantic-settings==2.15.0",
  "python-multipart==0.0.32",
  "sqlalchemy==2.0.52",
  "uvicorn[standard]==0.52.4",
]

[dependency-groups]
dev = [
  # Starlette 0.52 TestClient prefers httpx2 on Python 3.11 and falls back to httpx.
  "httpx2==2.12.0",
  "pytest==9.1.1",
  "ruff==0.16.4",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001"]
